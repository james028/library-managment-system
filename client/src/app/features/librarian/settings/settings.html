<div class="settings-page">
  <header class="page-header">
    <h1>Ustawienia</h1>
    <p>Konfiguracja zasad działania biblioteki</p>
  </header>

  <div class="settings-layout">
    <aside class="settings-sidebar" aria-label="Kategorie ustawień">
      <nav>
        <button
          type="button"
          class="settings-nav-item"
          [class.active]="activeSection === 'loans'"
          (click)="setSection('loans')"
        >
          Wypożyczenia
        </button>

        <button
          type="button"
          class="settings-nav-item"
          [class.active]="activeSection === 'fines'"
          (click)="setSection('fines')"
        >
          Opłaty
        </button>

        <button
          type="button"
          class="settings-nav-item"
          [class.active]="activeSection === 'holds'"
          (click)="setSection('holds')"
        >
          Rezerwacje
        </button>

        <button
          type="button"
          class="settings-nav-item"
          [class.active]="activeSection === 'notifications'"
          (click)="setSection('notifications')"
        >
          Powiadomienia
        </button>

        <button
          type="button"
          class="settings-nav-item"
          [class.active]="activeSection === 'library'"
          (click)="setSection('library')"
        >
          Biblioteka
        </button>
      </nav>
    </aside>

    <section class="settings-content" aria-label="Panel ustawień">
      @if (loading()) {
        <p class="status-message" role="status">
          Ładowanie ustawień...
        </p>
      } @else if (errorDataMessage()) {
        <div class="status-message error-message" role="alert">
          {{ errorDataMessage() }}
        </div>
      } @else {
        @if (!activeSection) {
          <p class="status-message">
            Wybierz kategorię ustawień z menu.
          </p>
        } @else {
          <app-settings-form
            [section]="activeSection"
            (sectionChange)="setSection($event)"
            [form]="form"
            [groups]="groups"
            [initialValues]="initial"
            [successMessage]="successMessage()"
            [errorMessage]="errorMessage()"
            [saving]="saving()"
            (saveClicked)="save()"
          ></app-settings-form>
        }
      }
    </section>
  </div>
</div>

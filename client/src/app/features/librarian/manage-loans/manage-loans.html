<div class="loans-container">
  <h2>Zarządzanie Wypożyczeniami</h2>
  @if (loansSummary$ | async; as loansSummary) {
    <div class="stats-grid">
      @for (key of statsKeys; track key) {
        <div class="stat-card">
          <span class="stat-label">{{ getLoanStatsLabel(key) }}</span>
          <span class="stat-value text-primary">{{ loansSummary[key] || "-" }}</span>
        </div>
      }
    </div>
  } @else {
    <p>Ładowanie profilu...</p>
  }
</div>

<app-table-filters
  [config]="loansFilterConfig"
  [value]="form"
  (apply)="onApplySubmit($event)"
  (reset)="onResetFilters()"
></app-table-filters>


@if (loansTableFacade.vm$ | async; as vm) {
  <app-data-table
    [rows]="vm.items"
    [columns]="loansColumns"
    [total]="vm.total"
    [page]="vm.query.page"
    [pageSize]="20"
    [loading]="vm.loading"
    [error]="vm.error"

  >
  </app-data-table>
}

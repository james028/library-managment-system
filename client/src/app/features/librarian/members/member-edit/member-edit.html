<form class="member-edit" [formGroup]="form" (ngSubmit)="submit()">
  <h3 class="member-edit__title">Edycja członka</h3>

  <div class="member-edit__grid">
    <div class="member-edit__field">
      <label for="firstName">Imię</label>
      <input id="firstName" type="text" formControlName="firstName" />
      @if (showError('firstName')) {
        <span class="member-edit__error">Imię jest wymagane.</span>
      }
    </div>

    <div class="member-edit__field">
      <label for="lastName">Nazwisko</label>
      <input id="lastName" type="text" formControlName="lastName" />
      @if (showError('lastName')) {
        <span class="member-edit__error">Nazwisko jest wymagane.</span>
      }
    </div>

    <div class="member-edit__field">
      <label for="email">E-mail</label>
      <input id="email" type="email" formControlName="email" />
      @if (showError('email')) {
        <span class="member-edit__error">
          @if (form.controls.email.hasError('required')) {
            E-mail jest wymagany.
          } @else {
            Podaj poprawny adres e-mail.
          }
        </span>
      }
    </div>

    <div class="member-edit__field">
      <label for="status">Status</label>
      <select id="status" formControlName="status">
        @for (option of statusOptions; track option.value) {
          <option [ngValue]="option.value">{{ option.label }}</option>
        }
      </select>
    </div>
  </div>

  @if (error) {
    <p class="member-edit__error member-edit__error--form" role="alert">
      {{ error }}
    </p>
  }

  <div class="member-edit__actions">
    <button
      type="submit"
      class="member-edit__button member-edit__button--primary"
      [disabled]="saving || !hasChanges || form.invalid"
    >
      {{ saving ? 'Zapisywanie...' : 'Zapisz' }}
    </button>

    <button
      type="button"
      class="member-edit__button member-edit__button--secondary"
      [disabled]="saving"
      (click)="cancel.emit()"
    >
      Anuluj
    </button>
  </div>
</form>

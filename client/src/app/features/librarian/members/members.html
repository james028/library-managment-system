<app-table-filters
  [config]="membersFilterConfig"
  [value]="filtersForm"
  (apply)="onApplySubmit($event)"
  (reset)="onResetFilters()"
></app-table-filters>


@if (facade.vm$ | async; as vm) {
  <app-data-table
    [rows]="vm.items"
    [columns]="memberColumns"
    [total]="vm.total"
    [page]="vm.query.page"
    [loading]="vm.loading"
    [error]="vm.error"
    (pageChange)="onChangePage($event)"
    (edit)="onEdit($event)"
  >
  </app-data-table>
}

@if (selectedMember) {
  <app-member-edit
    [member]="selectedMember"
    [saving]="saving"
    [error]="saveError"
    (save)="onSaveEdit($event)"
    (cancel)="cancelEdit()"
  ></app-member-edit>
}
